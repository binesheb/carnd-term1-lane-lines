name: Validate notebooks

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  validate-notebooks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Validate notebook JSON
        shell: python
        run: |
          import json
          from pathlib import Path

          notebooks = sorted(Path("CarND").rglob("*.ipynb"))
          if not notebooks:
              raise SystemExit("No notebooks found under CarND/")

          for notebook in notebooks:
              with notebook.open(encoding="utf-8") as handle:
                  document = json.load(handle)
              if document.get("nbformat") not in (4,):
                  raise SystemExit(f"Unsupported or missing nbformat in {notebook}")
              if "cells" not in document:
                  raise SystemExit(f"Missing cells array in {notebook}")

          print(f"Validated {len(notebooks)} notebook(s).")
